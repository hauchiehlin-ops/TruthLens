name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Vercel secrets
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)
          if (( ${#missing[@]} )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install and authenticate Vercel CLI
        run: |
          npm install --global vercel@latest
          vercel whoami --token="$VERCEL_TOKEN"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate external benchmark evidence
        run: >-
          python3 training/validate_release_evidence.py
          --contract training/benchmark_contract.json
          --report training/validation/current.json

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Prepare Vercel output
        run: |
          cp web/vercel.json build/web/vercel.json
          mkdir -p build/web/api
          cp web/api/proxy.js build/web/api/proxy.js
          test -f build/web/api/proxy.js

      - name: Link Vercel project
        working-directory: ./build/web
        run: >-
          vercel pull --yes --environment=production
          --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        working-directory: ./build/web
        run: >-
          vercel deploy --prod --yes --archive=tgz
          --token="$VERCEL_TOKEN"
