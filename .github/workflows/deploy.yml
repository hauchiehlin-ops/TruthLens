name: Deploy to Vercel

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Validate external benchmark evidence
        run: >-
          python3 training/validate_release_evidence.py
          --contract training/benchmark_contract.json
          --report training/validation/current.json

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build web
        run: flutter build web

      - name: Deploy Preview to Vercel (PR)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: build/web
          production: false

      - name: Comment PR with Vercel URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const vercelUrl = process.env.VERCEL_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed to Vercel: https://${vercelUrl}`
            });
        env:
          VERCEL_URL: ${{ steps.deploy-preview.outputs.preview-url }}
